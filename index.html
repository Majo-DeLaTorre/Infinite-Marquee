<!DOCTYPE html>
<html>
  
    <head>
    <meta charset="UTF-8">
    <title>Infinite Marquee</title>
    <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="poster">
            <div class="poster"><img src="images/Poster.png" alt=""></div>
        </div>

        <br>

        <div class="slider" style="
            --width: 100px;
            --height: 50px;
            --quantity: 10;            
        ">

        <div class="list">
            <div class="item" style="--position: 1"><img src="images/slider1-02.png" alt=""></div>
            <div class="item" style="--position: 2"><img src="images/slider1-03.png" alt=""></div>
            <div class="item" style="--position: 3"><img src="images/slider1-04.png" alt=""></div>
            <div class="item" style="--position: 4"><img src="images/slider1-05.png" alt=""></div>
            <div class="item" style="--position: 5"><img src="images/slider1-06.png" alt=""></div>
            <div class="item" style="--position: 6"><img src="images/slider1-07.png" alt=""></div>
            <div class="item" style="--position: 7"><img src="images/slider1-08.png" alt=""></div>
            <div class="item" style="--position: 8"><img src="images/slider1-09.png" alt=""></div>
            <div class="item" style="--position: 9"><img src="images/slider1-10.png" alt=""></div>
            <div class="item" style="--position: 10"><img src="images/slider1-11.png" alt=""></div>
        </div>
        </div>

        <br>
        <br>

        <div class="slider" reverse="true" style="
            --width: 100px;
            --height: 200px;
            --quantity: 10;            
        ">

        <div class="list">
            <div class="item" style="--position: 1"><img src="images/product-12.png" alt=""></div>
            <div class="item" style="--position: 2"><img src="images/product-13.png" alt=""></div>
            <div class="item" style="--position: 3"><img src="images/product-14.png" alt=""></div>
            <div class="item" style="--position: 4"><img src="images/product-15.png" alt=""></div>
            <div class="item" style="--position: 5"><img src="images/product-16.png" alt=""></div>
            <div class="item" style="--position: 6"><img src="images/product-17.png" alt=""></div>
            <div class="item" style="--position: 7"><img src="images/product-18.png" alt=""></div>
            <div class="item" style="--position: 8"><img src="images/product-19.png" alt=""></div>
            <div class="item" style="--position: 9"><img src="images/product-20.png" alt=""></div>
            <div class="item" style="--position: 10"><img src="images/product-21.png" alt=""></div>
        </div>
        </div>


    </body>
</html>
